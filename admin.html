<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Watch Mumbai - Moderator Portal</title>
<!-- Google Fonts: Inter -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #090d16;
  --surface: #131b2e;
  --surface-card: rgba(19, 27, 46, 0.85);
  --ink: #f8fafc;
  --mute: #94a3b8;
  --line: rgba(255, 255, 255, 0.08);
  --brand-orange: #ff7e36;
  --brand-orange-light: rgba(255, 126, 54, 0.15);
  --red: #ef4444;
  --green: #10b981;
  --purple: #9c27b0;
  --blue: #38bdf8;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  padding: 20px;
}

.container { max-width: 900px; margin: auto; }

header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px; background: var(--surface); border: 1px solid var(--line);
  border-radius: 16px; margin-bottom: 30px;
}
header h2 { margin: 0; font-size: 22px; font-weight: 800; color: var(--brand-orange); }

.report-card {
  background: var(--surface-card); border: 1px solid var(--line);
  border-radius: 18px; padding: 24px; margin-bottom: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}
.resolved-card { border-left: 6px solid var(--purple); background: rgba(156, 39, 176, 0.05); }

/* PIPELINE STAGES */
.pipeline { display: flex; gap: 8px; margin: 18px 0; }
.pipeline-step {
  flex: 1; padding: 10px; text-align: center; border-radius: 8px;
  font-size: 12px; font-weight: 800; background: rgba(255,255,255,0.05); color: var(--mute);
  border: 1px solid var(--line);
}
.pipeline-step.active-1 { background: rgba(16, 185, 129, 0.2); color: var(--green); border-color: var(--green); }
.pipeline-step.active-2 { background: rgba(56, 189, 248, 0.2); color: var(--blue); border-color: var(--blue); }
.pipeline-step.active-3 { background: rgba(156, 39, 176, 0.2); color: var(--purple); border-color: var(--purple); }

input[type="text"] {
  background: var(--bg); border: 1px solid var(--line); color: var(--ink);
  padding: 10px 14px; border-radius: 10px; font-size: 14px; width: 68%; margin-right: 8px;
}
button { font: inherit; cursor: pointer; border: 0; font-weight: 700; border-radius: 10px; padding: 10px 16px; transition: 0.2s; }
.btn-verify { background: var(--green); color: #fff; width: 100%; margin-top: 10px; }
.btn-tweet { background: var(--blue); color: #000; }
.btn-resolve { background: var(--purple); color: #fff; width: 100%; margin-top: 15px; padding: 12px; }

.badge { padding: 4px 10px; border-radius: 99px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
.bg-active { background: rgba(255, 126, 54, 0.15); color: var(--brand-orange); }
.bg-resolved { background: rgba(156, 39, 176, 0.2); color: var(--purple); }

p { margin: 8px 0; font-size: 14px; color: var(--mute); }
strong { color: var(--ink); }
</style>
</head>
<body>

  <div class="container">
    <header>
      <h2>Watch Mumbai — Admin Pipeline</h2>
      <span style="font-size: 13px; color: var(--mute);">3-Stage Moderation & Push Dispatch</span>
    </header>
    
    <div id="reports-container">
      <p style="text-align:center; padding: 40px;">Loading reports from database...</p>
    </div>
  </div>

  <script>
    const RENDER_URL = "https://poster-bot-ji8e.onrender.com";
    const ADMIN_TOKEN = "watchmumbai_admin_2026";

    async function fetchAdminReports() {
      try {
        const res = await fetch(`${RENDER_URL}/api/admin/reports`, {
          headers: { 'Authorization': ADMIN_TOKEN }
        });
        const reports = await res.json();
        renderReportCards(reports);
      } catch (err) {
        document.getElementById('reports-container').innerHTML = '<p style="color:var(--red); text-align:center;">Failed to connect to backend server.</p>';
      }
    }

    function renderReportCards(reports) {
      const container = document.getElementById('reports-container');
      container.innerHTML = '';

      if (reports.length === 0) {
        container.innerHTML = '<p style="text-align:center; color:var(--mute);">No submissions found.</p>';
        return;
      }

      reports.forEach(r => {
        let stage = 1;
        if (r.resolved) stage = 3;
        else if (r.status === 'published' || r.tweetUrl) stage = 2;
        else if (r.status === 'approved') stage = 2;

        const card = document.createElement('div');
        card.className = `report-card ${r.resolved ? 'resolved-card' : ''}`;
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3 style="margin:0; font-size:18px; color:var(--ink);">Ticket: ${r.reportId}</h3>
            <span class="badge ${r.resolved ? 'bg-resolved' : 'bg-active'}">
              ${r.resolved ? 'CLOSED & RESOLVED' : 'ACTIVE PIPELINE'}
            </span>
          </div>

          <!-- 3-STAGE VISUAL PIPELINE -->
          <div class="pipeline">
            <div class="pipeline-step ${stage >= 1 ? 'active-1' : ''}">1. Verified</div>
            <div class="pipeline-step ${stage >= 2 ? 'active-2' : ''}">2. X Published</div>
            <div class="pipeline-step ${stage === 3 ? 'active-3' : ''}">3. BMC Resolved</div>
          </div>

          <p><strong>Ward:</strong> ${r.ward || 'N/A'}</p>
          <p><strong>Landmark:</strong> ${r.land || 'N/A'}</p>
          <p><strong>Citizen Handle:</strong> ${r.handle || 'Anonymous'}</p>

          <div style="margin-top:20px; border-top:1px solid var(--line); padding-top:16px;">
            <!-- STEP 1 CONTROL -->
            ${r.status === 'pending' ? `
              <button class="btn-verify" onclick="approveStage1('${r.reportId}')">✅ Step 1: Verify & Approve Submission</button>
            ` : `<p style="color:var(--green); font-size:13px;">✔ Step 1 Complete: Verification alert dispatched.</p>`}

            <!-- STEP 2 CONTROL -->
            <div style="margin-top:14px;">
              <input type="text" id="tweet-input-${r.reportId}" value="${r.tweetUrl || ''}" placeholder="Paste X (Twitter) URL (https://x.com/...)" />
              <button class="btn-tweet" onclick="publishStage2('${r.reportId}')">🚀 Save & Push Tweet</button>
            </div>

            <!-- STEP 3 CONTROL -->
            <div style="margin-top:16px;">
              ${!r.resolved ? `
                <button class="btn-resolve" onclick="resolveStage3('${r.reportId}')">🎉 Step 3: Mark BMC Resolved & Close Ticket</button>
              ` : `
                <div style="background:rgba(156, 39, 176, 0.15); color:var(--purple); padding:12px; border-radius:10px; text-align:center; font-weight:800; font-size:13px; border:1px solid rgba(156, 39, 176, 0.3);">
                  🏁 Ticket Successfully Closed & Archived
                </div>
              `}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function approveStage1(id) {
      await fetch(`${RENDER_URL}/api/admin/reports/${id}/approve`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': ADMIN_TOKEN },
        body: JSON.stringify({})
      });
      alert('Stage 1 Complete: Citizen notified of verification!');
      fetchAdminReports();
    }

    async function publishStage2(id) {
      const tweetUrl = document.getElementById(`tweet-input-${id}`).value;
      if (!tweetUrl) return alert('Please paste a Tweet URL first!');

      await fetch(`${RENDER_URL}/api/admin/reports/${id}/approve`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': ADMIN_TOKEN },
        body: JSON.stringify({ tweetUrl })
      });
      alert('Stage 2 Complete: Tweet published and mobile push alert dispatched!');
      fetchAdminReports();
    }

    async function resolveStage3(id) {
      if (!confirm('Mark this ticket as fully resolved by BMC and close it?')) return;

      await fetch(`${RENDER_URL}/api/admin/reports/${id}/resolve`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': ADMIN_TOKEN },
        body: JSON.stringify({})
      });
      alert('Stage 3 Complete: Ticket closed and final resolution push alert sent!');
      fetchAdminReports();
    }

    fetchAdminReports();
  </script>
</body>
</html>
