<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Mumbai - Moderator Portal</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 900px; margin: auto; }
    h2 { color: #1976D2; text-align: center; }
    .report-card { background: white; padding: 20px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .resolved-card { border-left: 6px solid #9C27B0; background: #faf5fb; }
    input[type="text"] { padding: 8px; width: 65%; border: 1px solid #ccc; border-radius: 4px; margin-right: 5px; }
    button { padding: 9px 14px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; }
    .btn-verify { background: #4CAF50; }
    .btn-tweet { background: #2196F3; }
    .btn-resolve { background: #9C27B0; width: 100%; margin-top: 10px; }
    .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; color: white; }
    .bg-success { background: #4CAF50; }
    .bg-warning { background: #ff9800; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Moderation Pipeline Dashboard</h2>
    <p style="text-align: center; color: #666;">Manage 3-stage workflows and trigger automated citizen push alerts.</p>
    
    <div id="reports-container">
      <p style="text-align:center;">Loading reports from MongoDB database...</p>
    </div>
  </div>

  <script>
    const RENDER_URL = 'https://poster-bot-ji8e.onrender.com';
    const ADMIN_TOKEN = 'watchmumbai_admin_2026';

    async function fetchAdminReports() {
      try {
        const res = await fetch(`${RENDER_URL}/api/admin/reports`, {
          headers: { 'Authorization': ADMIN_TOKEN }
        });
        const reports = await res.json();
        renderReportCards(reports);
      } catch (err) {
        document.getElementById('reports-container').innerHTML = '<p style="color:red; text-align:center;">Failed to connect to backend server.</p>';
      }
    }

    function renderReportCards(reports) {
      const container = document.getElementById('reports-container');
      container.innerHTML = '';

      if (reports.length === 0) {
        container.innerHTML = '<p style="text-align:center;">No reports found.</p>';
        return;
      }

      reports.forEach(r => {
        let stage = 1;
        if (r.resolved) stage = 3;
        else if (r.status === 'published' || r.tweetUrl) stage = 2;
        else if (r.status === 'approved') stage = 2;

        const card = document.createElement('div');
        card.className = `report-card ${r.resolved ? 'resolved-card' : ''}`;
        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>Ticket ID: ${r.reportId}</h3>
            <span class="badge ${r.resolved ? 'bg-success' : 'bg-warning'}">
              ${r.resolved ? 'CLOSED & RESOLVED' : 'ACTIVE PIPELINE'}
            </span>
          </div>

          <!-- 3-STAGE PROGRESS PIPELINE -->
          <div style="display:flex; margin: 15px 0; border-radius:6px; overflow:hidden; border: 1px solid #ddd;">
            <div style="flex:1; padding:8px; text-align:center; background:${stage >= 1 ? '#4CAF50' : '#e0e0e0'}; color:${stage >= 1 ? 'white' : '#666'}; font-size:13px; font-weight:bold;">
              Step 1: Verified
            </div>
            <div style="flex:1; padding:8px; text-align:center; background:${stage >= 2 ? '#2196F3' : '#e0e0e0'}; color:${stage >= 2 ? 'white' : '#666'}; font-size:13px; font-weight:bold;">
              Step 2: X Published
            </div>
            <div style="flex:1; padding:8px; text-align:center; background:${stage === 3 ? '#9C27B0' : '#e0e0e0'}; color:${stage === 3 ? 'white' : '#666'}; font-size:13px; font-weight:bold;">
              Step 3: BMC Resolved
            </div>
          </div>

          <p><strong>Ward:</strong> ${r.ward || 'N/A'} | <strong>Landmark:</strong> ${r.land || 'N/A'}</p>
          <p><strong>Citizen Handle:</strong> ${r.handle || 'Anonymous'}</p>

          <div style="margin-top:15px; border-top:1px solid #eee; padding-top:12px;">
            <!-- STEP 1 -->
            ${r.status === 'pending' ? `
              <button class="btn-verify" onclick="approveStage1('${r.reportId}')">✅ Step 1: Verify & Approve</button>
            ` : `<p style="color:#2e7d32; font-size:14px; margin:5px 0;">✔ Step 1 Completed (Approved & Alert Sent)</p>`}

            <!-- STEP 2 -->
            <div style="margin-top:10px;">
              <input type="text" id="tweet-input-${r.reportId}" value="${r.tweetUrl || ''}" placeholder="Paste Tweet URL (https://x.com/...)" />
              <button class="btn-tweet" onclick="publishStage2('${r.reportId}')">🚀 Step 2: Save & Push Tweet</button>
            </div>

            <!-- STEP 3 -->
            <div style="margin-top:15px;">
              ${!r.resolved ? `
                <button class="btn-resolve" onclick="resolveStage3('${r.reportId}')">🎉 Step 3: Mark BMC Resolved & Close Ticket</button>
              ` : `
                <div style="background:#e8f5e9; color:#2e7d32; padding:10px; border-radius:4px; text-align:center; font-weight:bold;">
                  🏁 Ticket Successfully Closed & Archived
                </div>
              `}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    async function approveStage1(id) {
      await fetch(`${RENDER_URL}/api/admin/reports/${id}/approve`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': ADMIN_TOKEN },
        body: JSON.stringify({})
      });
      alert('Stage 1 Complete: User notified of approval!');
      fetchAdminReports();
    }

    async function publishStage2(id) {
      const tweetUrl = document.getElementById(`tweet-input-${id}`).value;
      if (!tweetUrl) return alert('Please paste a Tweet URL first!');

      await fetch(`${RENDER_URL}/api/admin/reports/${id}/approve`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': ADMIN_TOKEN },
        body: JSON.stringify({ tweetUrl })
      });
      alert('Stage 2 Complete: Tweet published & alert sent!');
      fetchAdminReports();
    }

    async function resolveStage3(id) {
      if (!confirm('Mark this ticket as fully resolved by BMC and close it?')) return;

      await fetch(`${RENDER_URL}/api/admin/reports/${id}/resolve`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': ADMIN_TOKEN },
        body: JSON.stringify({})
      });
      alert('Stage 3 Complete: Ticket closed and final resolution push notification sent!');
      fetchAdminReports();
    }

    fetchAdminReports();
  </script>
</body>
</html>
