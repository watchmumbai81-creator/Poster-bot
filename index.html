<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Mumbai - Civic Reporting Platform</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f4f9; margin: 0; padding: 20px; color: #333; }
    .container { max-width: 600px; background: white; padding: 30px; margin: auto; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { color: #d32f2f; text-align: center; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; }
    input, textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background: #d32f2f; color: white; border: none; padding: 12px; width: 100%; font-size: 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #b71c1c; }
    #status-box { margin-top: 20px; padding: 15px; background: #e8f5e9; border: 1px solid #c8e6c9; border-radius: 4px; display: none; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Watch Mumbai</h2>
    <p style="text-align: center; color: #666;">Report illegal hoardings & track real-time resolution.</p>

    <div class="form-group">
      <label>Pin / Landmark Description:</label>
      <input type="text" id="land" placeholder="e.g. Near Dadar Station West bridge">
    </div>

    <div class="form-group">
      <label>BMC Ward:</label>
      <select id="ward">
        <option value="G/North (Dadar/Mahim)">G/North (Dadar/Mahim)</option>
        <option value="H/West (Bandra)">H/West (Bandra)</option>
        <option value="K/West (Andheri)">K/West (Andheri)</option>
        <option value="A (Colaba/Churchgate)">A (Colaba/Churchgate)</option>
      </select>
    </div>

    <div class="form-group">
      <label>Your X (Twitter) Handle (Optional):</label>
      <input type="text" id="handle" placeholder="@yourhandle">
    </div>

    <button onclick="submitReport()">Submit Report & Enable Alerts</button>

    <div id="status-box">
      <h3>Report Submitted Successfully!</h3>
      <p><strong>Tracking Code:</strong> <span id="lbl-id"></span></p>
      <p>You will receive live mobile push notifications as your report moves through verification, X publication, and BMC resolution.</p>
    </div>
  </div>

  <script>
    const RENDER_URL = 'https://poster-bot-ji8e.onrender.com';
    const PUBLIC_VAPID_KEY = 'BDXFXCWNi2K_vCaDAxP9eO9LJGyMsNya__c2WU86X6M8AidXTwN35Wpl3rU5l-eWOy_oHipRd8MLEdtf9y3fUXQ';

    // Register Service Worker
    if ('serviceWorker' in navigator && 'PushManager' in window) {
      navigator.serviceWorker.register('/sw.js')
        .then(reg => console.log('Service Worker Registered'))
        .catch(err => console.error('SW Registration Failed', err));
    }

    async function getPushSubscription() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return null;
      try {
        const registration = await navigator.serviceWorker.ready;
        let subscription = await registration.pushManager.getSubscription();

        if (!subscription) {
          const permission = await Notification.requestPermission();
          if (permission !== 'granted') return null;

          subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: urlBase64ToUint8Array(PUBLIC_VAPID_KEY)
          });
        }
        return subscription;
      } catch (err) {
        console.error('Push Subscription error:', err);
        return null;
      }
    }

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/\-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      const outputArray = new Uint8Array(rawData.length);
      for (let i = 0; i < rawData.length; ++i) {
        outputArray[i] = rawData.charCodeAt(i);
      }
      return outputArray;
    }

    async function submitReport() {
      const land = document.getElementById('land').value;
      const ward = document.getElementById('ward').value;
      const handle = document.getElementById('handle').value;

      if (!land) {
        alert('Please enter a landmark description.');
        return;
      }

      const pushSub = await getPushSubscription();

      const payload = {
        land,
        ward,
        handle,
        pushSubscription: pushSub
      };

      try {
        const res = await fetch(`${RENDER_URL}/api/reports`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();

        if (data.success) {
          document.getElementById('lbl-id').innerText = data.report.id;
          document.getElementById('status-box').style.display = 'block';
        } else {
          alert('Submission failed: ' + data.error);
        }
      } catch (err) {
        alert('Server connection error. Please check your backend URL.');
        console.error(err);
      }
    }
  </script>
</body>
</html>
