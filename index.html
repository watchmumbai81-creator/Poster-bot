<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Mumbai - Citizen Hoarding Reporting</title>
  
  <!-- Leaflet CSS for Maps -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background-color: #f8fafc; color: #1e293b; }
    header { background: #0f172a; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 1.4rem; font-weight: 700; }
    header span { background: #38bdf8; color: #0f172a; padding: 4px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
    
    .main-container { display: flex; flex-direction: column; height: calc(100vh - 60px); }
    @media (min-width: 768px) { .main-container { flex-direction: row; } }
    
    #map { flex: 1; min-height: 350px; width: 100%; }
    .form-panel { width: 100%; max-width: 420px; background: white; padding: 20px; overflow-y: auto; border-left: 1px solid #e2e8f0; box-shadow: -2px 0 10px rgba(0,0,0,0.05); }
    
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.95rem; }
    .form-group input[readonly] { background-color: #f1f5f9; cursor: not-allowed; }
    
    .btn-submit { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.2s; }
    .btn-submit:hover { background: #1d4ed8; }
    
    /* Notification Toast Component */
    #citizenNotifBox { display: none; position: fixed; bottom: 20px; right: 20px; background: #ffffff; padding: 16px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); max-width: 350px; z-index: 9999; border-left: 5px solid #2563eb; }
    #citizenNotifBox h4 { margin: 0 0 6px 0; color: #0f172a; font-size: 1rem; }
    #citizenNotifBox p { margin: 0; font-size: 0.88rem; color: #475569; line-height: 1.4; }
    .tweet-link-btn { display: inline-block; margin-top: 10px; background: #1da1f2; color: white; padding: 8px 12px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: bold; }
    .status-tag { display: inline-block; margin-top: 6px; padding: 2px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
    .status-pending { background: #fef3c7; color: #92400e; }
    .status-approved { background: #dbeafe; color: #1e40af; }
    .status-published { background: #dcfce7; color: #166534; }
  </style>
</head>
<body>

  <header>
    <h1>🏙️ Watch Mumbai</h1>
    <span>Citizen Reporting Desk</span>
  </header>

  <div class="main-container">
    <!-- Map Container -->
    <div id="map"></div>

    <!-- Reporting Form -->
    <div class="form-panel">
      <h3>🚨 Report Illegal Hoarding</h3>
      <p style="font-size: 0.85rem; color: #64748b;">Click anywhere on the map or allow location access to auto-fill ward data.</p>
      
      <form id="hoardingForm">
        <div class="form-group">
          <label for="landmark">Landmark / Location Details</label>
          <input type="text" id="landmark" placeholder="e.g. Near Dadar Station West" required>
        </div>

        <div class="form-group">
          <label for="pincode">Pincode</label>
          <input type="text" id="pincode" placeholder="e.g. 400028" required pattern="[0-9]{6}">
        </div>

        <div class="form-group">
          <label for="ward">Mapped BMC Ward</label>
          <input type="text" id="ward" readonly placeholder="Auto-detected Ward...">
        </div>

        <div class="form-group">
          <label for="handle">BMC Twitter Handle</label>
          <input type="text" id="handle" readonly placeholder="@mybmc...">
        </div>

        <div class="form-group">
          <label for="photo">Upload Photo Proof</label>
          <input type="file" id="photo" accept="image/*" required>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">Submit Report to Watch Mumbai</button>
      </form>
    </div>
  </div>

  <!-- Real-time Citizen Notification Toast -->
  <div id="citizenNotifBox">
    <div id="notifContent"></div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    const API_URL = "https://poster-bot-ji8e.onrender.com"; // Render Backend URL
    let selectedLat = 19.0760;
    let selectedLng = 72.8777;
    let base64Photo = "";

    // BMC Ward Mapping Database (24 Wards)
    const bmcWards = [
      { name: "Ward A (Colaba/Fort)", handle: "@mybmcWardA", lat: 18.9220, lng: 72.8335 },
      { name: "Ward B (Sandhurst Road)", handle: "@mybmcWardB", lat: 18.9500, lng: 72.8370 },
      { name: "Ward C (Marine Lines)", handle: "@mybmcWardC", lat: 18.9511, lng: 72.8258 },
      { name: "Ward D (Grant Road/Malabar Hill)", handle: "@mybmcWardD", lat: 18.9600, lng: 72.8150 },
      { name: "Ward E (Byculla)", handle: "@mybmcWardE", lat: 18.9750, lng: 72.8300 },
      { name: "Ward F/North (Matunga)", handle: "@mybmcWardFN", lat: 19.0270, lng: 72.8550 },
      { name: "Ward F/South (Parel)", handle: "@mybmcWardFS", lat: 19.0030, lng: 72.8420 },
      { name: "Ward G/North (Dadar)", handle: "@mybmcWardGN", lat: 19.0180, lng: 72.8430 },
      { name: "Ward G/South (Worli)", handle: "@mybmcWardGS", lat: 18.9980, lng: 72.8170 },
      { name: "Ward H/East (Bandra East)", handle: "@mybmcWardHE", lat: 19.0600, lng: 72.8520 },
      { name: "Ward H/West (Bandra West)", handle: "@mybmcWardHW", lat: 19.0550, lng: 72.8300 },
      { name: "Ward K/East (Andheri East)", handle: "@mybmcWardKE", lat: 19.1150, lng: 72.8560 },
      { name: "Ward K/West (Andheri West)", handle: "@mybmcWardKW", lat: 19.1300, lng: 72.8250 },
      { name: "Ward L (Kurla)", handle: "@mybmcWardL", lat: 19.0700, lng: 72.8800 },
      { name: "Ward M/East (Govandi)", handle: "@mybmcWardME", lat: 19.0450, lng: 72.9150 },
      { name: "Ward M/West (Chembur)", handle: "@mybmcWardMW", lat: 19.0620, lng: 72.8970 },
      { name: "Ward N (Ghatkopar)", handle: "@mybmcWardN", lat: 19.0860, lng: 72.9080 },
      { name: "Ward S (Bhandup)", handle: "@mybmcWardS", lat: 19.1450, lng: 72.9350 },
      { name: "Ward T (Mulund)", handle: "@mybmcWardT", lat: 19.1720, lng: 72.9560 },
      { name: "Ward P/North (Malad)", handle: "@mybmcWardPN", lat: 19.1860, lng: 72.8480 },
      { name: "Ward P/South (Goregaon)", handle: "@mybmcWardPS", lat: 19.1550, lng: 72.8470 },
      { name: "Ward R/Central (Borivali)", handle: "@mybmcWardRC", lat: 19.2300, lng: 72.8560 },
      { name: "Ward R/North (Dahisar)", handle: "@mybmcWardRN", lat: 19.2570, lng: 72.8590 },
      { name: "Ward R/South (Kandivali)", handle: "@mybmcWardRS", lat: 19.2050, lng: 72.8520 }
    ];

    // Initialize Leaflet Map centered on Mumbai
    const map = L.map('map').setView([19.0760, 72.8777], 12);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    let currentMarker = L.marker([19.0760, 72.8777], { draggable: true }).addTo(map);

    // Get closest ward by coordinates
    function getClosestWard(lat, lng) {
      let minDistance = Infinity;
      let closest = bmcWards[0];

      bmcWards.forEach(w => {
        const dist = Math.hypot(w.lat - lat, w.lng - lng);
        if (dist < minDistance) {
          minDistance = dist;
          closest = w;
        }
      });
      return closest;
    }

    function updateWardFields(lat, lng) {
      selectedLat = lat;
      selectedLng = lng;
      const mapped = getClosestWard(lat, lng);
      document.getElementById('ward').value = mapped.name;
      document.getElementById('handle').value = mapped.handle;
    }

    map.on('click', function(e) {
      const { lat, lng } = e.latlng;
      currentMarker.setLatLng([lat, lng]);
      updateWardFields(lat, lng);
    });

    currentMarker.on('dragend', function(e) {
      const { lat, lng } = e.target.getLatLng();
      updateWardFields(lat, lng);
    });

    // Handle Image Conversion to Base64
    document.getElementById('photo').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onloadend = function() {
          base64Photo = reader.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // Handle Form Submission
    document.getElementById('hoardingForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;
      submitBtn.textContent = "Submitting Report...";

      const reportData = {
        land: document.getElementById('landmark').value,
        pin: document.getElementById('pincode').value,
        ward: document.getElementById('ward').value,
        handle: document.getElementById('handle').value,
        lat: selectedLat,
        lng: selectedLng,
        photo: base64Photo
      };

      try {
        const res = await fetch(`${API_URL}/api/reports`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(reportData)
        });

        const data = await res.json();

        if (data.success) {
          const reportId = data.report.id;
          
          // Save Report ID to local storage for persistent tracking
          localStorage.setItem("my_last_report_id", reportId);

          alert(`Report submitted successfully!\nTracking ID: #${reportId}\n\nOur moderator team is reviewing it.`);
          
          document.getElementById('hoardingForm').reset();
          submitBtn.disabled = false;
          submitBtn.textContent = "Submit Report to Watch Mumbai";

          // Immediately poll notifications
          pollNotifications(reportId);
        } else {
          alert("Failed to submit report. Please try again.");
          submitBtn.disabled = false;
          submitBtn.textContent = "Submit Report to Watch Mumbai";
        }
      } catch (err) {
        alert("Server network error. Check backend connection.");
        submitBtn.disabled = false;
        submitBtn.textContent = "Submit Report to Watch Mumbai";
      }
    });

    // Poll Notifications Function
    async function pollNotifications(reportId) {
      if (!reportId) return;

      try {
        const res = await fetch(`${API_URL}/api/reports/${reportId}/notifications`);
        const data = await res.json();

        if (data.success && data.notifications.length > 0) {
          const latestNotif = data.notifications[data.notifications.length - 1];
          displayNotificationBox(latestNotif, data.status);
        }
      } catch (err) {
        console.error("Polling notification error:", err);
      }
    }

    function displayNotificationBox(notif, status) {
      const box = document.getElementById("citizenNotifBox");
      const content = document.getElementById("notifContent");
      
      let statusClass = "status-pending";
      if (status === "approved") statusClass = "status-approved";
      if (status === "published") statusClass = "status-published";

      content.innerHTML = `
        <h4>🔔 Report Status Update</h4>
        <span class="status-tag ${statusClass}">Status: ${status}</span>
        <p style="margin-top:8px;">${notif.message}</p>
        ${notif.tweetUrl ? `<a href="${notif.tweetUrl}" target="_blank" class="tweet-link-btn">View Tweet on X 🔗</a>` : ''}
      `;

      box.style.display = "block";
    }

    // Auto-check notifications every 10 seconds if a previous report ID exists in local storage
    window.addEventListener("DOMContentLoaded", () => {
      updateWardFields(19.0760, 72.8777);

      const savedReportId = localStorage.getItem("my_last_report_id");
      if (savedReportId) {
        pollNotifications(savedReportId);
        setInterval(() => pollNotifications(savedReportId), 10000); // Check every 10 seconds
      }
    });
  </script>
</body>
</html>
